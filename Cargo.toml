[package]
name = "rgmin"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local first-order minimization over eindir differentiable objectives."
repository = "https://github.com/OmniPotentRPC/rgmin"
readme = "README.md"
keywords = ["optimization", "conjugate-gradient", "linesearch"]
categories = ["science", "mathematics"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[lib]
name = "rgmin"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
capi = []
par = ["dep:rayon"]
highs = ["dep:highs", "dep:highs-sys"]

[dependencies]
eindir-core = { version = "0.6.0", git = "https://github.com/HaoZeke/eindir.git", rev = "091c6f7d6ea70821c3374152481fb9500e799af2", features = ["capi"] }
dlpk = { version = "0.1.5", features = ["ndarray"] }
ndarray = "0.17"
thiserror = "2"
rand = "0.9"
rayon = { version = "1.10", optional = true }
highs = { version = "2.1", optional = true }
highs-sys = { version = "1.12", optional = true }

[dev-dependencies]
approx = "0.5"
rgpot-core = { package = "rgpot-core", git = "https://github.com/OmniPotentRPC/rgpot.git", rev = "b19227f9197a4c927633f1225f1e7546794a6f1e" }

[build-dependencies]
cbindgen = "0.29"

[package.metadata.capi]
min_version = "0.10.17"

[package.metadata.capi.header]
name = "rgmin.h"
subdirectory = ""
generation = true
enabled = true

[package.metadata.capi.pkg_config]
name = "rgmin"
filename = "rgmin"
description = "Local first-order minimization C ABI"

[package.metadata.capi.library]
name = "rgmin"

[[example]]
name = "compare_highs"
required-features = ["highs"]

[[example]]
name = "ffi_throughput"
required-features = ["capi"]


[profile.release]
lto = "thin"
codegen-units = 1
