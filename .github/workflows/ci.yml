name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: cargo test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: capi
            args: --features capi
          - name: highs
            args: --features highs
          - name: all-features
            args: --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Python reference dependencies
        run: python -m pip install -q numpy scipy
      - run: cargo build --locked ${{ matrix.args }}
      - run: cargo test --locked ${{ matrix.args }}

  cinstall:
    name: cargo cinstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-c
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 install cargo-c --locked --version 0.10.17+cargo-0.92.0
      - name: Install into a prefix and compile C and C++
        run: tests/cinstall/smoke.sh
